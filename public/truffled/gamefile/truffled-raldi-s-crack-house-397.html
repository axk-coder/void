<!DOCTYPE html>
<html lang="en">
<head>
<base href="https://snoopylovestruffle.getinspiredflight.com/games/raldi/">

  <meta charset="utf-8">
  <title>BALDI</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #unity-container {
      width: 100%;
      height: 100%;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: black;
    }
  </style>


</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>

  <script src="TemplateData/BALDI.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");

    createUnityInstance(canvas, {
      dataUrl: "Build/BALDI.data",
      frameworkUrl: "Build/BALDI.framework.js",
      codeUrl: "Build/BALDI.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Unknown",
      productName: "BALDI",
      productVersion: "1.0"
    });
  </script>
</body>
</html>
