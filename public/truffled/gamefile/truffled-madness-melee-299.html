<!DOCTYPE html>
<html lang="en-us">

  <head>
<script>window.alert=window.prompt=window.confirm=function(){};</script>

<base href="https://snoopylovestruffle.getinspiredflight.com/games/bogtruffled/">

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | MadnessMelee</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden; 
        display: flex; 
        justify-content: center;
        align-items: center;
        background: #231F20; 
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain; 
        background: #231F20;
      }
    </style>


</head>
  <body>
    <canvas id="unity-canvas" width=960 height=600></canvas>
    <script src="Build/bogtruffled.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/bogtruffled.data",
        frameworkUrl: "Build/bogtruffled.framework.js",
        codeUrl: "Build/bogtruffled.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Orsoniks",
        productName: "MadnessMelee",
        productVersion: "0.01",
        matchWebGLToCanvasSize: true, 
      });
    </script>
  </body>
</html>
