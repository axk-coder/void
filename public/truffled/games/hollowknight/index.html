<!DOCTYPE html><html lang="en-us"><head>
<script>window.alert=window.prompt=window.confirm=function(){};</script>
<meta charset="utf-8"><title>Hollow Knight</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden}#lt{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font:24px Arial}#unity-canvas{width:100vw;height:100vh;display:block}.btn{position:fixed;top:12px;padding:10px 18px;cursor:pointer;background:rgba(50,50,50,.85);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;font:14px Arial;z-index:9999}.btn:hover{background:rgba(70,70,70,.95)}</style>


</head><body>
<link rel="preload" href="sharedassets8.resource" as="fetch">
<link rel="preload" href="sharedassets127.resource" as="fetch">
<link rel="preload" href="sharedassets400.resource" as="fetch">
<link rel="preload" href="sharedassets410.resource" as="fetch">
<div id="lt">Loading...</div>

<canvas id="unity-canvas"></canvas>
<script>
const lt=document.getElementById('lt'),cv=document.getElementById('unity-canvas');
let lb=0;const tm='912.81';

async function fwp(u){const r=await fetch(u),rd=r.body.getReader(),ch=[];while(true){const{done,value}=await rd.read();if(done)break;lb+=value.length;ch.push(value);lt.textContent=`${(lb/1048576).toFixed(2)} MB / ${tm} MB`;}return new Blob(ch);}
async function mf(p,t='application/octet-stream'){const b=await Promise.all(p.map(fwp));return URL.createObjectURL(new Blob(b,{type:t}));}
function gp(f,s,e){return Array.from({length:e-s+1},(_,i)=>`${f}.part${s+i}`);}

(async()=>{
  const[du,wu]=await Promise.all([mf(gp('Build/hktruffled.data',1,45)),mf(gp('Build/hktruffled.wasm',1,2),'application/wasm')]);
  const sc=document.createElement('script');sc.src='Build/hktruffled.loader.js';
  sc.onload=()=>createUnityInstance(cv,{dataUrl:du,frameworkUrl:'Build/hktruffled.framework.js',codeUrl:wu,streamingAssetsUrl:new URL('StreamingAssets',location.href).href,companyName:'Team Cherry',productName:'Hollow Knight',productVersion:'1.0',memory:384*1024*1024,useWebGL2:true,webglContextAttributes:{antialias:false,alpha:false,depth:true,stencil:false,premultipliedAlpha:false,preserveDrawingBuffer:false,desynchronized:true}}).then(instance=>{window.unityInstance=instance;lt.remove();}).catch(alert);
  document.body.appendChild(sc);
})();
</script>
</body></html>
