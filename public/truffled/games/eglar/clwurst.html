

<!DOCTYPE html>
<html>
<head>
<script>window.alert=window.prompt=window.confirm=function(){};</script>

  <meta charset="utf-8">
  <title>wurst</title>


</head>
<body>

    <script>
    async function loadAndRun() {
      const urls = [
        "https://cdn.jsdelivr.net/gh/shayderrr/eaglercraft@main/wurst/clwurstclient.html.part1",
        "https://cdn.jsdelivr.net/gh/shayderrr/eaglercraft@main/wurst/clwurstclient.html.part2"
      ];

      let fullHtml = "";
      for (const u of urls) {
        const res = await fetch(u);
        fullHtml += await res.text();
      }

      document.open();
      document.write(fullHtml);
      document.close();
    }

    loadAndRun();
  </script>
</body>
</html>
