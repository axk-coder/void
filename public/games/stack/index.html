<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stack Tower</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body {
  background: #121214;
  color: #ececed;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
}
.header {
  margin-bottom: 12px;
  display: flex;
  gap: 24px;
  font-size: 14px;
  font-weight: 700;
}
.stat span { color: #5865F2; }
canvas {
  background: #18181b;
  border: 1px solid #27272a;
  border-radius: 8px;
  max-width: 95vw;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  cursor: pointer;
}
.instructions {
  margin-top: 12px;
  font-size: 12px;
  color: #71717a;
}
</style>
</head>
<body>
<div class="header">
  <div class="stat">SCORE: <span id="score">0</span></div>
  <div class="stat">BEST: <span id="best">0</span></div>
</div>
<canvas id="canvas" width="400" height="550"></canvas>
<div class="instructions">Click, Tap, or Spacebar to Place Block</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

let bestScore = parseInt(localStorage.getItem('stack_best') || '0', 10);
bestEl.textContent = String(bestScore);

const BLOCK_HEIGHT = 20;
let stack = [];
let debris = [];
let currentBlock = null;
let direction = 1;
let speed = 3;
let score = 0;
let gameOver = false;
let cameraY = 0;

const COLORS = [
  '#ef4444', '#f97316', '#f59e0b', '#10b981', '#06b6d4',
  '#3b82f6', '#6366f1', '#8b5cf6', '#d946ef', '#ec4899'
];

function getColor(index) {
  return COLORS[index % COLORS.length];
}

function initGame() {
  score = 0;
  gameOver = false;
  speed = 3;
  cameraY = 0;
  scoreEl.textContent = '0';
  stack = [
    { x: 100, y: 500, w: 200, color: getColor(0) }
  ];
  debris = [];
  spawnNext();
}

function spawnNext() {
  const prev = stack[stack.length - 1];
  const newY = prev.y - BLOCK_HEIGHT;
  currentBlock = {
    x: 0,
    y: newY,
    w: prev.w,
    color: getColor(stack.length)
  };
  direction = 1;
  speed = 3 + Math.min(stack.length * 0.1, 7);
}

function placeBlock() {
  if (gameOver) {
    initGame();
    return;
  }

  const prev = stack[stack.length - 1];
  const diff = currentBlock.x - prev.x;

  if (Math.abs(diff) <= 3) {
    currentBlock.x = prev.x;
  }

  const overlap = prev.w - Math.abs(currentBlock.x - prev.x);

  if (overlap <= 0) {
    gameOver = true;
    debris.push({
      x: currentBlock.x,
      y: currentBlock.y,
      w: currentBlock.w,
      vy: 2,
      color: currentBlock.color
    });
    currentBlock = null;
    return;
  }

  let placedX = currentBlock.x > prev.x ? currentBlock.x : prev.x;
  let placedW = overlap;

  if (currentBlock.x > prev.x) {
    debris.push({
      x: prev.x + overlap,
      y: currentBlock.y,
      w: currentBlock.x + currentBlock.w - (prev.x + overlap),
      vy: 2,
      color: currentBlock.color
    });
  } else if (currentBlock.x < prev.x) {
    debris.push({
      x: currentBlock.x,
      y: currentBlock.y,
      w: prev.x - currentBlock.x,
      vy: 2,
      color: currentBlock.color
    });
  }

  stack.push({
    x: placedX,
    y: currentBlock.y,
    w: placedW,
    color: currentBlock.color
  });

  score++;
  scoreEl.textContent = String(score);
  if (score > bestScore) {
    bestScore = score;
    bestEl.textContent = String(bestScore);
    localStorage.setItem('stack_best', String(bestScore));
  }

  spawnNext();
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    placeBlock();
  }
});

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  placeBlock();
});

function update() {
  if (currentBlock && !gameOver) {
    currentBlock.x += speed * direction;
    if (currentBlock.x + currentBlock.w >= canvas.width) {
      currentBlock.x = canvas.width - currentBlock.w;
      direction = -1;
    } else if (currentBlock.x <= 0) {
      currentBlock.x = 0;
      direction = 1;
    }
  }

  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.vy += 0.4;
    d.y += d.vy;
    if (d.y - cameraY > canvas.height + 50) {
      debris.splice(i, 1);
    }
  }

  if (stack.length > 0) {
    const topY = stack[stack.length - 1].y;
    const targetCameraY = Math.max(0, 350 - topY);
    cameraY += (targetCameraY - cameraY) * 0.1;
  }
}

function draw() {
  ctx.fillStyle = '#18181b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(0, cameraY);

  for (let b of stack) {
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, BLOCK_HEIGHT - 2, 3);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(b.x, b.y, b.w, 3);
  }

  for (let d of debris) {
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.roundRect(d.x, d.y, d.w, BLOCK_HEIGHT - 2, 3);
    ctx.fill();
  }

  if (currentBlock && !gameOver) {
    ctx.fillStyle = currentBlock.color;
    ctx.beginPath();
    ctx.roundRect(currentBlock.x, currentBlock.y, currentBlock.w, BLOCK_HEIGHT - 2, 3);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.w, 3);
  }

  ctx.restore();

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ef4444';
    ctx.font = 'bold 24px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, 240);
    ctx.fillStyle = '#ececed';
    ctx.font = '16px system-ui';
    ctx.fillText(`Score: ${score}`, canvas.width / 2, 275);
    ctx.fillStyle = '#a1a1aa';
    ctx.font = '13px system-ui';
    ctx.fillText('Tap or Press Space to Restart', canvas.width / 2, 310);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

initGame();
loop();
</script>
</body>
</html>
