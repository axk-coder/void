<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 400px;
    }
    .title { font-size: 24px; font-weight: 800; }
    .score { font-size: 16px; color: #a3a3a3; font-weight: 600; }
    canvas {
      background: #141414;
      border: 2px solid #333333;
      border-radius: 8px;
    }
    .btn {
      background: #f5f5f5;
      color: #0a0a0a;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: #e0e0e0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">Snake</div>
      <div class="score">Score: <span id="score">0</span></div>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <button class="btn" id="start-btn">Start Game</button>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const startBtn = document.getElementById('start-btn');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    let snake = [{ x: 10, y: 10 }];
    let velocity = { x: 0, y: 0 };
    let food = { x: 15, y: 15 };
    let score = 0;
    let gameInterval = null;
    let running = false;

    function resetGame() {
      snake = [{ x: 10, y: 10 }];
      velocity = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = '0';
      spawnFood();
      running = true;
      startBtn.textContent = 'Restart';
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, 100);
    }

    function spawnFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
    }

    function gameLoop() {
      if (!running) return;

      const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#141414';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? '#e5e5e5' : '#888888';
        ctx.fillRect(snake[i].x * gridSize + 1, snake[i].y * gridSize + 1, gridSize - 2, gridSize - 2);
      }
    }

    function gameOver() {
      running = false;
      clearInterval(gameInterval);
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
      startBtn.textContent = 'Play Again';
    }

    window.addEventListener('keydown', (e) => {
      if (!running) return;
      if ((e.code === 'ArrowUp' || e.code === 'KeyW') && velocity.y !== 1) {
        e.preventDefault();
        velocity = { x: 0, y: -1 };
      } else if ((e.code === 'ArrowDown' || e.code === 'KeyS') && velocity.y !== -1) {
        e.preventDefault();
        velocity = { x: 0, y: 1 };
      } else if ((e.code === 'ArrowLeft' || e.code === 'KeyA') && velocity.x !== 1) {
        e.preventDefault();
        velocity = { x: -1, y: 0 };
      } else if ((e.code === 'ArrowRight' || e.code === 'KeyD') && velocity.x !== -1) {
        e.preventDefault();
        velocity = { x: 1, y: 0 };
      }
    });

    startBtn.addEventListener('click', resetGame);
    draw();
  </script>
</body>
</html>
