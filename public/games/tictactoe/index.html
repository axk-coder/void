<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f1113;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 300px; }
    .header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .title { font-size: 20px; font-weight: 800; }
    .status { font-size: 14px; color: #a5adb5; font-weight: 600; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      aspect-ratio: 1 / 1;
    }
    .cell {
      background: #1c2023;
      border: 2px solid #3c444b;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 800;
      color: #f5f5f5;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .cell:hover { background: #252a2e; }
    .cell.x { color: #f5f5f5; }
    .cell.o { color: #a5adb5; }
    .btn { background: #f5f5f5; color: #0a0a0a; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="title">Tic Tac Toe</div>
      <div class="status" id="status">Your Turn (X)</div>
    </div>
    <div class="board" id="board"></div>
    <button class="btn" id="restart-btn">Restart</button>
  </div>
  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restart-btn');

    let board = Array(9).fill(null);
    let isGameOver = false;

    function init() {
      board = Array(9).fill(null);
      isGameOver = false;
      statusEl.textContent = 'Your Turn (X)';
      boardEl.innerHTML = '';

      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;
        cell.addEventListener('click', () => makeMove(i));
        boardEl.appendChild(cell);
      }
    }

    function checkWinner(b) {
      const lines = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      for (const [x, y, z] of lines) {
        if (b[x] && b[x] === b[y] && b[x] === b[z]) return b[x];
      }
      if (b.every(c => c !== null)) return 'tie';
      return null;
    }

    function makeMove(i) {
      if (board[i] || isGameOver) return;
      board[i] = 'X';
      render();

      const win = checkWinner(board);
      if (win) {
        handleEnd(win);
        return;
      }

      statusEl.textContent = 'AI Thinking...';
      setTimeout(aiMove, 200);
    }

    function aiMove() {
      if (isGameOver) return;
      const empty = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
      if (empty.length === 0) return;

      let move = empty[0];
      for (const idx of empty) {
        const testB = [...board];
        testB[idx] = 'O';
        if (checkWinner(testB) === 'O') { move = idx; break; }
      }
      if (move === empty[0]) {
        for (const idx of empty) {
          const testB = [...board];
          testB[idx] = 'X';
          if (checkWinner(testB) === 'X') { move = idx; break; }
        }
      }

      board[move] = 'O';
      render();

      const win = checkWinner(board);
      if (win) {
        handleEnd(win);
      } else {
        statusEl.textContent = 'Your Turn (X)';
      }
    }

    function handleEnd(win) {
      isGameOver = true;
      if (win === 'tie') statusEl.textContent = 'Tie Game!';
      else statusEl.textContent = win === 'X' ? 'You Win!' : 'AI Wins!';
    }

    function render() {
      const cells = boardEl.children;
      for (let i = 0; i < 9; i++) {
        cells[i].textContent = board[i] || '';
        cells[i].className = 'cell' + (board[i] ? ' ' + board[i].toLowerCase() : '');
      }
    }

    restartBtn.addEventListener('click', init);
    init();
  </script>
</body>
</html>
