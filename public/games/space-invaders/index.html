<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .header { display: flex; justify-content: space-between; width: 480px; font-size: 16px; font-weight: 700; }
    canvas { background: #121212; border: 2px solid #262626; border-radius: 8px; }
    .hint { font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <span>Space Invaders</span>
      <span>Score: <span id="score">0</span></span>
    </div>
    <canvas id="game" width="480" height="420"></canvas>
    <div class="hint">Left/Right or A/D to Move • Space to Shoot</div>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    let player = { x: 220, y: 380, w: 28, h: 14, speed: 4.5 };
    let bullets = [];
    let enemies = [];
    let enemyDirection = 1;
    let enemyStepDown = false;
    let score = 0;
    let lastShot = 0;
    const keys = {};

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function initEnemies() {
      enemies = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 8; c++) {
          enemies.push({
            x: 40 + c * 48,
            y: 30 + r * 32,
            w: 24,
            h: 18,
            alive: true
          });
        }
      }
    }

    initEnemies();

    function update() {
      if (keys['ArrowLeft'] || keys['KeyA']) player.x = Math.max(10, player.x - player.speed);
      if (keys['ArrowRight'] || keys['KeyD']) player.x = Math.min(canvas.width - player.w - 10, player.x + player.speed);

      if (keys['Space'] && performance.now() - lastShot > 280) {
        bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 10, vy: -7 });
        lastShot = performance.now();
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y += bullets[i].vy;
        if (bullets[i].y < 0) bullets.splice(i, 1);
      }

      let hitWall = false;
      enemies.forEach(e => {
        if (!e.alive) return;
        if ((enemyDirection === 1 && e.x + e.w >= canvas.width - 20) || (enemyDirection === -1 && e.x <= 20)) {
          hitWall = true;
        }
      });

      if (hitWall) {
        enemyDirection *= -1;
        enemyStepDown = true;
      }

      let allDead = true;
      enemies.forEach(e => {
        if (!e.alive) return;
        allDead = false;
        e.x += enemyDirection * 0.8;
        if (enemyStepDown) e.y += 10;

        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
            e.alive = false;
            bullets.splice(i, 1);
            score += 20;
            scoreEl.textContent = score;
            break;
          }
        }

        if (e.y + e.h >= player.y) {
          score = 0;
          scoreEl.textContent = '0';
          initEnemies();
        }
      });

      enemyStepDown = false;

      if (allDead) {
        initEnemies();
      }
    }

    function draw() {
      ctx.fillStyle = '#121212';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillRect(player.x + 10, player.y - 4, 8, 4);

      ctx.fillStyle = '#ffffff';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = '#a3a3a3';
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = '#121212';
        ctx.fillRect(e.x + 4, e.y + 4, 4, 4);
        ctx.fillRect(e.x + e.w - 8, e.y + 4, 4, 4);
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
